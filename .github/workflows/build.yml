name: build and publish

# Two ways in:
#   - push a v* tag: build the package, attach it to the GitHub release, and
#     push PKGBUILD + .SRCINFO to the AUR-style repository
#   - run manually: build only, so a broken change can be caught before tagging
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # The AUR-style package repository this workflow publishes to.
  #
  # aur-a.meowarch.top is the web front end and sits behind Cloudflare, which
  # only proxies 80/443 — the SSH push port is unreachable there. The git host
  # resolves to the origin server directly.
  AUR_HOST: git.aur-a.meowarch.top
  AUR_PORT: '22222'
  AUR_USER: aur
  AUR_REPO_NAME: chromius

jobs:
  build:
    # Arch's own toolchain is what the package targets; building anywhere else
    # invites glibc and TypeScript-version surprises.
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git openssh \
            nodejs typescript gcc

      # makepkg refuses to run as root, which is the default in containers.
      - name: Create build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder

      # The PKGBUILD takes its source from the v$pkgver tag, which is the right
      # thing for users cloning the AUR repository — but it cannot work for a
      # manual run from a branch, because that tag may not exist yet. Pack the
      # checkout into the same layout the git source produces so the packaging
      # steps are still exercised before a tag is created.
      - name: Use the checkout as the source (branch builds)
        if: github.ref_type != 'tag'
        working-directory: packaging/aur
        run: |
          ver=$(sed -n 's/^pkgver=//p' PKGBUILD | head -1)
          # tar the working tree rather than `git archive`: the checkout was
          # chown'd to the build user above, so git refuses to read it as root.
          mkdir -p "$RUNNER_TEMP/srcroot/chromius"
          tar -cf - -C "$GITHUB_WORKSPACE" \
              --exclude=.git --exclude=node_modules --exclude=out \
              --exclude=pkg --exclude='*.pkg.tar.zst' . \
            | tar -xf - -C "$RUNNER_TEMP/srcroot/chromius"
          tar -czf "chromius-$ver.tar.gz" -C "$RUNNER_TEMP/srcroot" chromius
          sed -i "s|git+https://github.com/xingguangcuican6666/chromius.git#tag=v\$pkgver|chromius-\$pkgver.tar.gz|" PKGBUILD
          grep -m1 '^source=' -A1 PKGBUILD
          chown -R builder:builder "$RUNNER_TEMP/srcroot" "chromius-$ver.tar.gz"

      - name: Build package
        working-directory: packaging/aur
        run: |
          su builder -c 'cd "$GITHUB_WORKSPACE/packaging/aur" && makepkg -f --noconfirm --nodeps'
          ls -la *.pkg.tar.zst

      # .SRCINFO is what the AUR (and any AUR helper) reads to learn the
      # package's metadata. It must match the PKGBUILD exactly, so it is
      # generated by makepkg rather than maintained by hand.
      - name: Regenerate .SRCINFO
        working-directory: packaging/aur
        run: |
          su builder -c 'cd "$GITHUB_WORKSPACE/packaging/aur" && makepkg --printsrcinfo > .SRCINFO'
          cat .SRCINFO

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromius-${{ github.ref_name }}
          path: packaging/aur/*.pkg.tar.zst
          retention-days: 30

      # ------------------------------------------------------------------
      # Publish. The deploy key comes from the repository secret, never from
      # a file in the tree, and is removed in the cleanup step even if a later
      # step fails.
      # ------------------------------------------------------------------
      - name: Set up deploy key
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.AUR_DEPLOY_KEY }}" > ~/.ssh/aur_deploy
          chmod 600 ~/.ssh/aur_deploy
          ssh-keyscan -p "$AUR_PORT" "$AUR_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host aur
            HostName $AUR_HOST
            Port $AUR_PORT
            User $AUR_USER
            IdentityFile ~/.ssh/aur_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Publish to AUR repository
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config --global user.name  "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

          # The AUR repository holds only what a user needs to rebuild the
          # package: PKGBUILD and .SRCINFO. Sources come from the tagged
          # GitHub release, the binary from the release assets.
          publish="$RUNNER_TEMP/publish"
          mkdir -p "$publish"
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO "$publish/"

          cd "$publish"
          git init -q -b master
          git add -A
          git commit -qm "chromius ${GITHUB_REF_NAME#v}"
          # aurweb names repositories by package base at the server root:
          # there is no per-user path segment in the push URL.
          git remote add origin "aur:$AUR_REPO_NAME.git"
          git push -f origin master

      # Built packages are binary artefacts: they belong on the GitHub release
      # for the tag, not in the source repository.
      - name: Attach package to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: packaging/aur/*.pkg.tar.zst
          fail_on_unmatched_files: false

      - name: Remove deploy key
        if: always()
        run: |
          rm -f ~/.ssh/aur_deploy ~/.ssh/config
          rm -rf ~/.ssh
